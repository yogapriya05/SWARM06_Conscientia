[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-swarm-simulator-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100", "numpy>=1.24", "PyYAML>=6.0", "uvicorn[standard]>=0.23"]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
